<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Device memory of one A100 40 GB</title>
<desc id="desc">With private weights, 9 isolated replicas fit, each with its own 2.89 GiB copy of the weights. With one shared segment, about 32 fit, each using 1.12 GiB, plus one copy of the weights and the broker.</desc>
